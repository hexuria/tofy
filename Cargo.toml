[package]
name = "tofy"
version = "0.1.0"
edition = "2021"
description = "Infrastructure from code, applied like OpenTofu"
license = "Apache-2.0"
repository = "https://github.com/hexuria/tofy"
authors = ["Uriah Galang"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
thiserror = "2.0"
