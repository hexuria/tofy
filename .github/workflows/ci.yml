name: ci

on:
  push:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test-and-apply:
    name: test and docker apply
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.83.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Unit tests
        run: cargo test --workspace

      - name: Require Docker
        run: docker info

      - name: Install host probe clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools

      - name: Apply, probe, and destroy
        run: bash scripts/ci-smoke.sh

  test-and-apply-tofu:
    name: test and tofu apply
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.83.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-tofu-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-tofu-
            ${{ runner.os }}-cargo-

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.0

      - name: Require Docker
        run: docker info

      - name: Require OpenTofu
        run: tofu version

      - name: Install host probe clients
        run: sudo apt-get update && sudo apt-get install -y postgresql-client redis-tools

      - name: Apply, probe, and destroy (OpenTofu backend)
        run: bash scripts/ci-smoke-tofu.sh

  test-and-validate-aws:
    name: test and aws validate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@1.83.0

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-aws-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-aws-
            ${{ runner.os }}-cargo-

      - name: Install OpenTofu
        uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.12.0

      - name: Require OpenTofu
        run: tofu version

      - name: Unit tests
        run: cargo test --workspace

      - name: Emit and validate AWS OpenTofu config
        run: bash scripts/ci-smoke-aws.sh
        env:
          AWS_ACCESS_KEY_ID: ""
          AWS_SECRET_ACCESS_KEY: ""
          AWS_SESSION_TOKEN: ""
          AWS_PROFILE: ""
