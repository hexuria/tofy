[package]
name = "tofy-pg"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Optional sqlx PgPool from tofy postgres outputs"

[dependencies]
serde_json.workspace = true
sqlx = { version = "=0.8.3", default-features = false, features = ["runtime-tokio", "postgres"] }
thiserror.workspace = true
tofy-spec.workspace = true
# Pin transitives so rustc 1.83 can compile (newer tokio/url pull edition2024 crates).
tokio = { version = "=1.43.0", default-features = false, features = ["rt", "net", "time"] }
url = "=2.5.0"
idna = "=0.5.0"
home = "=0.5.9"

[dev-dependencies]
tempfile = "=3.14.0"
